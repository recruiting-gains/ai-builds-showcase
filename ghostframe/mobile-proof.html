<!doctype html><html lang="en"><meta charset="utf-8"><title>Ghostframe responsive proof</title><style>body{background:#0b1020;color:#dce5f4;font:16px system-ui}iframe{width:390px;height:844px;border:1px solid #586778}p{max-width:650px}button{padding:12px;margin:8px;background:#c2efff;border:0}</style><h1>Responsive browser layout check</h1><p>The iframe provides a real CSS viewport. This checks layout and controls, not physical iPhone performance or touch tracking. Native fullscreen is intentionally unavailable in this iframe.</p><button id="portrait">Portrait 390 × 844</button><button id="landscape">Landscape 844 × 390</button><br><iframe title="Phone-width Ghostframe" src="/"></iframe><script>const frame=document.querySelector('iframe');for(const [id,w,h] of [['portrait',390,844],['landscape',844,390]])document.getElementById(id).onclick=()=>{frame.style.width=w+'px';frame.style.height=h+'px';};</script></html>
