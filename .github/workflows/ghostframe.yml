name: GhostFrame checks
on:
  push:
    paths: ['ghostframe/**', '.github/workflows/ghostframe.yml']
  pull_request:
    paths: ['ghostframe/**', '.github/workflows/ghostframe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ghostframe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ghostframe/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate --ignore-scripts
      - run: npm run assets
      - run: npm run types
      - run: npm test
      - run: npm run test:harness
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:phone
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npm run check:deploy
