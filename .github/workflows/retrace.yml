name: ReTrace checks
on:
  push:
    paths: ['retrace/**', '.github/workflows/retrace.yml', '.github/workflows/retrace-release.yml']
  pull_request:
    paths: ['retrace/**', '.github/workflows/retrace.yml', '.github/workflows/retrace-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: retrace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: retrace/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run test:worker
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Verify 3D interactions and accessibility
        run: |
          mkdir -p artifacts
          npm exec vite -- preview --host 127.0.0.1 --port 5179 --strictPort > artifacts/experience-server.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5179/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:experience
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npm run check:deploy
      - name: Save browser validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrace-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: retrace/artifacts/
          retention-days: 7
