name: Airframe checks

on:
  push:
    paths:
      - 'airframe/**'
      - '.github/workflows/airframe.yml'
  pull_request:
    paths:
      - 'airframe/**'
      - '.github/workflows/airframe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airframe-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 24 · types, tests, build, and actual Worker runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: airframe
        shell: bash
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: airframe/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types, unit tests, build, and deployment bundle
        run: npm run check
      - name: Boot real local Wrangler and verify HTTP behavior
        env:
          AIRFRAME_SMOKE_PORT: '8797'
        run: npx tsx scripts/runtime-smoke.ts
