name: Foldspace checks
on:
  push:
    paths: ['foldspace/**', '.github/workflows/foldspace.yml']
  pull_request:
    paths: ['foldspace/**', '.github/workflows/foldspace.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foldspace-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Node 24 · puzzle rules, types, lint, Worker build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: foldspace
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: foldspace/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
