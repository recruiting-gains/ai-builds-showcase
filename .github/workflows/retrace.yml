name: ReTrace checks
on:
  push:
    paths: ['retrace/**', '.github/workflows/retrace.yml', '.github/workflows/retrace-release.yml']
  pull_request:
    paths: ['retrace/**', '.github/workflows/retrace.yml', '.github/workflows/retrace-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: retrace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: retrace/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run test:worker
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npm run check:deploy
