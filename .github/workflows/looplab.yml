name: LoopLab checks

on:
  push:
    paths:
      - 'looplab/**'
      - '.github/workflows/looplab.yml'
  pull_request:
    paths:
      - 'looplab/**'
      - '.github/workflows/looplab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: looplab-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 24 · tests, evaluation, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: looplab
        shell: bash
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: looplab/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check implementation and prepare deployment bundle
        run: npm run check
